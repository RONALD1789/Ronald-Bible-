<style>

  body.dark{--bg:#101813;--card:#18231c;--ink:#e8f0e9;--muted:#a5b4a8;--green:#78c69a;--green2:#9bd9b2;--line:#2d4033;--soft:#21372a;--blue:#214b5b}body.dark .hero-card{background:linear-gradient(135deg,#123b29,#1c5b3a)}body.dark .vblock.is-highlighted summary{background:#4a3b16}body.dark .note{background:#21372a;color:#d1e5d6}
  @media(max-width:560px){body{padding:12px 10px 70px}.dashboard{grid-template-columns:1fr}.mini-stack{grid-template-columns:1fr 1fr}.hero-card{padding:16px}.nav{flex-wrap:wrap}.nav select{max-width:none}.nav button{flex:1}.search-row{flex-wrap:wrap}.search-row input{flex-basis:100%}}

<body>

<div class="brand-mark" aria-hidden="true">✝</div>
<h1>RonaldBible</h1>
<p class="subtitle">Read Scripture. Understand the Word. Grow every day.</p>
<div class="dashboard" id="dashboard">
  <section class="hero-card"><div class="eyebrow">✦ Verse for today</div><div class="daily-text" id="dailyText">Loading your daily verse…</div><div class="daily-ref" id="dailyRef"></div><button onclick="openDailyVerse()">Read this passage →</button></section>
  <div class="mini-stack"><section class="mini-card"><strong id="savedCount">0</strong><span>Saved verses</span></section><section class="mini-card"><strong id="readCount">0</strong><span>Chapters visited</span></section><section class="mini-card"><strong id="streakCount">0 days</strong><span>Reading streak</span></section></div>
</div>
<section class="tools" aria-label="Bible tools">
 <div class="search-row"><input id="searchInput" placeholder="Search the Bible by word or phrase…" aria-label="Search Bible"><button class="action-btn" onclick="searchBible()">Search</button></div>
 <div class="tool-buttons"><button onclick="showLibrary('bookmarks')">🔖 Bookmarks</button><button class="secondary" onclick="showLibrary('notes')">📝 My notes</button><button class="secondary" onclick="showLibrary('highlights')">✨ Highlights</button><button class="secondary" onclick="showPlans()">📖 Reading plans</button><button class="secondary" onclick="showTopics()">🧭 Topical studies</button><button class="secondary" onclick="showCrossReferences()">🔗 Cross-references</button><button class="secondary" onclick="showBibleDictionary()">📚 Bible dictionary</button><button class="secondary" onclick="showStudyGuide()">🧠 Study guide</button><button class="secondary" onclick="showPrayerJournal()">🙏 Prayer journal</button><button class="secondary" onclick="readCurrentChapter()">🔊 Read aloud</button><button class="secondary" onclick="showBackup()">💾 Backup & restore</button><button class="secondary" onclick="toggleTheme()" id="themeBtn">🌙 Dark mode</button></div>
 <div class="search-row"><label for="fontSize" class="muted" style="align-self:center;white-space:nowrap">Text size</label><input id="fontSize" type="range" min="16" max="26" value="18" oninput="setFontSize(this.value)" aria-label="Bible text size"></div>
</section>
<div id="utilityPanel" class="panel hidden"></div>
<div id="searchResults" class="panel hidden"></div>

<div id="loading">Loading the whole Bible&hellip;</div>

<div class="nav" id="nav" style="display:none">
  <button id="prevBtn" onclick="nav(-1)">&#8592; Prev</button>
  <select id="bookSel" onchange="onBookChange()"></select>
  <select id="chapSel" onchange="onChapChange()"></select>
  <button id="nextBtn" onclick="nav(1)">Next &#8594;</button>
</div>
<p class="progress-line" id="progressLine"></p>
<div id="content"></div>

<div id="rb-toast" class="rb-toast" role="alert"></div>

<script src="/bible-data.js"></script>
<script src="/preloaded-comm.js"></script>
<script>
const DATA_URL = "https://base44.app/api/apps/6a0b28c046523946b4de86ae/files/mp/public/6a0b28c046523946b4de86ae/57c32b5f2_bible-kjv.json";
const COMMENTARY_URL = "https://base44.app/api/apps/6a0b28c046523946b4de86ae/functions/getCommentaryList";
const TAP_URL = "https://base44.app/api/apps/6a0b28c046523946b4de86ae/functions/verseCommentaryTap";
let offlineMode = false;
const GATEWAY = "https://www.biblegateway.com/passage/?search=";

let books = [];
let chapterStartOrder = [];
let commentaryByOrder = {};
let commentaryCount = 0;

// Non-blocking toast to replace window.alert in sandboxed iframes
function showToast(msg, isError = false) {
  const toast = document.getElementById('rb-toast');
  if (!toast) return;
  toast.textContent = msg;
  toast.className = 'rb-toast visible' + (isError ? ' error' : '');
  clearTimeout(toast._timer);
  toast._timer = setTimeout(() => {
    toast.className = 'rb-toast';
  }, 3500);
}
window.alert = showToast;

function gatewayUrl(book, ch, v) {
  return GATEWAY + encodeURIComponent(book).replace(/%20/g, "+") + "+" + ch + ":" + v + "&version=NKJV";
}

function esc(s) {
  return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
}

function orderOf(bookIdx, chap) {
  return chapterStartOrder[bookIdx] + chap - 1;
}

async function init() {
  const [dataRes, commRes] = await Promise.all([
    window.BIBLE_DATA ? Promise.resolve({ json: async () => window.BIBLE_DATA }) : fetch(DATA_URL),
    fetch(COMMENTARY_URL).catch(() => null)
  ]);
  const data = await dataRes.json();
  books = data.b;
  initPersonalTools();

  let o = 0;
  chapterStartOrder = [];
  for (const b of books) {
    chapterStartOrder.push(o + 1);
    o += b.c.length;
  }

  if (commRes && commRes.ok) {
    try {
      const comm = await commRes.json();
      commentaryCount = comm.count || 0;
      for (const c of (comm.chapters || [])) commentaryByOrder[c.order] = c;
      try { localStorage.setItem("rb-list", JSON.stringify(comm)); } catch (e) {}
    } catch (e) { /* ignore */ }
  } else {
    offlineMode = true;
    let comm = null;
    try { comm = JSON.parse(localStorage.getItem("rb-list") || "null"); } catch (e) {}
    if (!comm && window.PRELOADED_COMM) {
      comm = window.PRELOADED_COMM;
      try {
        localStorage.setItem("rb-list", JSON.stringify({
          count: comm.count,
          chapters: (comm.chapters || []).map(c => ({ order: c.order, book: c.book, chapter: c.chapter, url: c.url }))
        }));
      } catch (e) {}
    }
    if (comm) {
      commentaryCount = comm.count || (comm.chapters ? comm.chapters.length : 0);
      for (const c of (comm.chapters || [])) {
        commentaryByOrder[c.order] = c;
        if (c.html) { try { localStorage.setItem("rb-chap-" + c.order, c.html); } catch (e) {} }
      }
    }
  }

  const bookSel = document.getElementById("bookSel");
  books.forEach((b, i) => {
    const opt = document.createElement("option");
    opt.value = i; opt.textContent = b.n;
    bookSel.appendChild(opt);
  });

  // Starting position: ?book=Name&chapter=N link wins, then saved place, then Genesis 1
  let bi = 0, ch = 1;
  const qs = new URLSearchParams(location.search);
  const qBook = qs.get("book");
  const qChap = parseInt(qs.get("chapter") || "0", 10);
  if (qBook) {
    const idx = books.findIndex(b => b.n.toLowerCase() === qBook.trim().toLowerCase());
    if (idx !== -1) bi = idx;
    if (qChap >= 1 && qChap <= books[bi].c.length) ch = qChap;
  } else {
    try {
      const saved = JSON.parse(localStorage.getItem("twe-pos") || "{}");
      if (saved.bi !== undefined && books[saved.bi]) { bi = saved.bi; ch = saved.ch || 1; }
    } catch (e) {}
  }

  document.getElementById("loading").style.display = "none";
  document.getElementById("nav").style.display = "flex";
  bookSel.value = bi;
  fillChapterSel(bi, ch);
  render(bi, ch);
}

function fillChapterSel(bi, selChap) {
  const chapSel = document.getElementById("chapSel");
  chapSel.innerHTML = "";
  const n = books[bi].c.length;
  for (let c = 1; c <= n; c++) {
    const opt = document.createElement("option");
    opt.value = c;
    opt.textContent = "Chapter " + c;
    if (commentaryByOrder[orderOf(bi, c)]) opt.textContent += " \u2713";
    chapSel.appendChild(opt);
  }
  chapSel.value = Math.min(selChap || 1, n);
}

function onBookChange() {
  const bi = parseInt(document.getElementById("bookSel").value);
  fillChapterSel(bi, 1);
  render(bi, 1);
}

function onChapChange() {
  const bi = parseInt(document.getElementById("bookSel").value);
  const ch = parseInt(document.getElementById("chapSel").value);
  render(bi, ch);
}

function nav(delta) {
  let bi = parseInt(document.getElementById("bookSel").value);
  let ch = parseInt(document.getElementById("chapSel").value);
  ch += delta;
  if (ch < 1) { bi -= 1; if (bi < 0) return; ch = books[bi].c.length; }
  if (ch > books[bi].c.length) { bi += 1; if (bi >= books.length) return; ch = 1; }
  document.getElementById("bookSel").value = bi;
  fillChapterSel(bi, ch);
  render(bi, ch);
}

// Inline chapter commentary
const chapterCommCache = new Map();

async function getChapterCommentary(order) {
  if (chapterCommCache.has(order)) return chapterCommCache.get(order);
  const meta = commentaryByOrder[order];
  let result = null;
  let txt = null;
  if (meta && meta.url) {
    try {
      const res = await fetch(meta.url);
      txt = await res.text();
      try { localStorage.setItem("rb-chap-" + order, txt); } catch (e) {}
    } catch (e) { txt = null; }
    if (txt === null) { try { txt = localStorage.getItem("rb-chap-" + order); } catch (e) {} }
    if (txt === null && window.PRELOADED_COMM) {
      const pc = (window.PRELOADED_COMM.chapters || []).find(c => c.order === order);
      if (pc && pc.html) txt = pc.html;
    }
  }
  if (txt) {
    try {
      const doc = new DOMParser().parseFromString(txt, "text/html");
      const kids = Array.from(doc.body.children);
      const isVerseHead = el =>
        el.classList.contains("verse-head") ||
        ((el.tagName === "H2" || el.tagName === "H3") && /VERSES?\s+\d+/i.test(el.textContent)) ||
        el.tagName === "DETAILS";
      const firstVerse = kids.findIndex(isVerseHead);
      const overview = firstVerse === -1 ? [] :
        kids.slice(0, firstVerse).filter(el =>
          el.tagName !== "H1" && el.tagName !== "STYLE" &&
          !el.classList.contains("subtitle") && !el.classList.contains("note"));
      const verses = {};
      const trailing = [];
      if (firstVerse !== -1) {
        let cur = null;
        for (const el of kids.slice(firstVerse)) {
          if (el.tagName === "DETAILS") {
            const badge = el.querySelector("summary .badge");
            const m = badge ? badge.textContent.match(/(\d+)\s*:\s*(\d+)\s*$/) : null;
            if (m) {
              const v = parseInt(m[2], 10);
              const explain = el.querySelector(".explain") || el;
              verses[v] = Array.from(explain.children).filter(x => !x.classList.contains("nkjv-link"));
            }
            continue;
          }
          if (isVerseHead(el)) {
            const m = el.textContent.match(/VERSES?\s+(\d+)/i);
            const n = m ? parseInt(m[1], 10) : null;
            if (n) { cur = n; if (!verses[n]) verses[n] = []; }
            continue;
          }
          if (el.classList.contains("summary") || el.tagName === "HR") cur = null;
          if (cur !== null && verses[cur]) {
            if (el.tagName === "BLOCKQUOTE") continue;
            verses[cur].push(el);
          } else {
            trailing.push(el);
          }
        }
      }
      const usable = Object.keys(verses).length > 0;
      result = usable ? { overview, verses, trailing } : { overview, verses: {}, trailing };
    } catch (e) { result = null; }
  }
  chapterCommCache.set(order, result);
  return result;
}

function fillVerseSlotFromEls(slot, els) {
  const wrap = document.createElement("div");
  wrap.className = "verse-commentary";
  els.forEach(el => wrap.appendChild(document.importNode(el, true)));
  slot.innerHTML = "";
  slot.appendChild(wrap);
}

function fillChapterInline(order, comm) {
  if (!comm) return;
  const ov = document.getElementById("chov-" + order);
  if (ov) {
    comm.overview.forEach(el => {
      if (el.textContent.trim()) ov.appendChild(document.importNode(el, true));
    });
    if (!ov.textContent.trim()) ov.remove();
  }
  const tr = document.getElementById("chtr-" + order);
  if (tr) {
    comm.trailing.forEach(el => {
      if (el.textContent.trim()) tr.appendChild(document.importNode(el, true));
    });
    if (!tr.textContent.trim()) tr.remove();
  }
  for (const vKey of Object.keys(comm.verses)) {
    const v = parseInt(vKey, 10);
    if (!comm.verses[v] || !comm.verses[v].length) continue;
    const slot = document.getElementById("vs-" + order + "-" + v);
    if (slot && !slot.querySelector(".verse-commentary")) {
      fillVerseSlotFromEls(slot, comm.verses[v]);
    }
  }
}

// Rendering
function render(bi, ch) {
  markReadingDay();
  const book = books[bi];
  const verses = book.c[ch - 1];
  const order = orderOf(bi, ch);
  const hasComm = !!commentaryByOrder[order];
  const totalDone = commentaryCount;

  document.getElementById("prevBtn").disabled = (bi === 0 && ch === 1);
  document.getElementById("nextBtn").disabled = (bi === books.length - 1 && ch === book.c.length);
  document.getElementById("progressLine").textContent = totalDone > 0
    ? totalDone + " of 1,189 chapters have full verse-by-verse commentary (\u2713 = done)"
    : "Verse-by-verse commentary is being written daily, starting from Genesis";

  try { localStorage.setItem("twe-pos", JSON.stringify({ bi, ch })); } catch (e) {}

  let html = "";
  if (hasComm) {
    html += '<div class="commentary-banner">This chapter\'s full commentary is written &mdash; tap any verse to read its context and meaning right here</div>';
  }
  if (offlineMode) {
    html += '<div class="commentary-banner" style="background:#8a6d3b">Offline &mdash; showing commentary saved on this device. New chapters and verse requests need a connection.</div>';
  }
  html += '<div class="note"><strong>' + esc(book.n) + ' ' + ch + '</strong> &mdash; King James Version. ' +
    'Tap any verse: its context and meaning appear here. ' +
    (hasComm
      ? 'For this chapter they are already written and appear instantly.'
      : 'If not written yet, they are written automatically, usually within a minute.') +
    ' You can also read any verse in the NKJV.</div>';

  if (hasComm) {
    html += '<div class="chapter-overview" id="chov-' + order + '"></div>';
  }

  for (let v = 1; v <= verses.length; v++) {
    const badge = esc(book.n).toUpperCase() + " " + ch + ":" + v;
    html += '<details class="vblock" data-book="' + esc(book.n) + '" data-ch="' + ch + '" data-v="' + v + '">' +
      '<summary><span class="ref-line"><span class="badge">' + badge + '</span></span>' +
      '<span class="verse-text">&ldquo;' + esc(verses[v - 1]) + '&rdquo;</span>' +
      '<span class="tap-hint">&#9662; Tap for the context and meaning</span></summary>' +
      '<div class="explain">' +
      '<div class="verse-actions"><button class="action-btn" onclick="event.preventDefault();toggleBookmark(\'' + esc(book.n) + '\',' + ch + ',' + v + ',this)">🔖 Save</button><button class="action-btn secondary" onclick="event.preventDefault();toggleHighlight(this)">✨ Highlight</button><button class="action-btn secondary" onclick="event.preventDefault();editNote(\'' + esc(book.n) + '\',' + ch + ',' + v + ')">📝 Note</button></div>' +
      '<a class="nkjv-link" href="' + gatewayUrl(book.n, ch, v) + '" target="_blank" rel="noopener">Read in NKJV &#8599;</a>' +
      '<div class="verse-slot" id="vs-' + (order) + '-' + v + '"></div>' +
      '</div></details>';
  }

  if (hasComm) {
    html += '<div class="chapter-trailing" id="chtr-' + order + '"></div>';
  }

  document.getElementById("content").innerHTML = html;
  try {
    const visited = JSON.parse(localStorage.getItem('rb-visited') || '[]');
    const key = book.n + ' ' + ch;
    if (!visited.includes(key)) visited.push(key);
    localStorage.setItem('rb-visited', JSON.stringify(visited));
    updateDashboard();
    document.querySelectorAll('.vblock').forEach(d => {
      const ref = d.dataset.book + ' ' + d.dataset.ch + ':' + d.dataset.v;
      const b = JSON.parse(localStorage.getItem('rb-bookmarks') || '{}');
      if (b[ref]) d.querySelector('.verse-actions .action-btn').textContent = '✓ Saved';
      const h = JSON.parse(localStorage.getItem('rb-highlights') || '{}');
      if (h[ref]) d.classList.add('is-highlighted');
    });
  } catch(e) {}

  document.querySelectorAll("details.vblock").forEach(d => {
    d.addEventListener("toggle", () => {
      if (d.open) requestVerse(d.dataset.book, parseInt(d.dataset.ch), parseInt(d.dataset.v), order);
    });
  });

  if (hasComm) {
    getChapterCommentary(order).then(comm => {
      if (comm) fillChapterInline(order, comm);
    });
  }

  window.scrollTo(0, 0);
}

// On-demand verse commentary
const slotPending = new Set();
const slotWritten = new Set();

async function requestVerse(book, ch, v, order) {
  const ref = book + " " + ch + ":" + v;
  if (slotPending.has(ref) || slotWritten.has(ref)) return;
  const slot = document.getElementById("vs-" + order + "-" + v);
  if (!slot) return;
  if (slot.querySelector(".verse-commentary")) return;

  if (commentaryByOrder[order]) {
    const comm = await getChapterCommentary(order);
    const fresh = document.getElementById("vs-" + order + "-" + v);
    if (fresh && fresh.querySelector(".verse-commentary")) return;
    if (comm && comm.verses[v] && comm.verses[v].length) {
      fillVerseSlotFromEls(fresh || slot, comm.verses[v]);
      slotWritten.add(ref);
      return;
    }
  }

  let savedV = null;
  try { savedV = localStorage.getItem("rb-v-" + order + "-" + v); } catch (e) {}
  if (savedV) { showWritten(slot, ref, savedV, order, v); return; }

  slotPending.add(ref);

  try {
    const res = await fetch(TAP_URL, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ book: book, chapter: ch, verse: v })
    });
    const data = await res.json();

    if (data.status === "written") {
      showWritten(slot, ref, data.content, order, v);
      return;
    }
    if (data.status === "busy") {
      slot.innerHTML = '<p class="writing-note">' + esc(data.message || "The writing queue is full - try again shortly.") + '</p>';
      slotPending.delete(ref);
      return;
    }
    slot.innerHTML = '<p class="writing-note">The context and meaning of ' + esc(ref) + ' are being written right now &mdash; they will appear here in about a minute. Keep this page open, or tap the verse again later.</p>';
    pollVerse(book, ch, v, order, ref, 8);
  } catch (err) {
    slot.innerHTML = '<p class="writing-note">' + ((navigator.onLine === false || offlineMode)
      ? "You are offline and this verse is not saved on your device yet. Reconnect and tap it again to request its commentary."
      : "Could not reach the commentary service. Check your connection and tap the verse again.") + '</p>';
    slotPending.delete(ref);
  }
}

async function pollVerse(book, ch, v, order, ref, triesLeft) {
  if (triesLeft <= 0) { slotPending.delete(ref); return; }
  const slot = document.getElementById("vs-" + order + "-" + v);
  if (!slot) { slotPending.delete(ref); return; }
  if (!slot.closest("details").open) { slotPending.delete(ref); return; }

  try {
    const res = await fetch(TAP_URL, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ book: book, chapter: ch, verse: v })
    });
    const data = await res.json();
    if (data.status === "written") { showWritten(slot, ref, data.content, order, v); return; }
  } catch (e) { /* keep polling */ }

  setTimeout(() => pollVerse(book, ch, v, order, ref, triesLeft - 1), 10000);
}

function showWritten(slot, ref, content, order, v) {
  slotWritten.add(ref);
  slotPending.delete(ref);
  slot.innerHTML = '<div class="verse-commentary">' + content + '</div>';
  if (order !== undefined && v !== undefined) {
    try { localStorage.setItem("rb-v-" + order + "-" + v, content); } catch (e) {}
  }
}

function readStore(key){try{return JSON.parse(localStorage.getItem(key)||'{}')}catch(e){return {}}}
function writeStore(key,value){try{localStorage.setItem(key,JSON.stringify(value))}catch(e){showToast('Device storage is full. Please remove some saved items.', true)}}
function verseText(book,ch,v){const b=books.find(x=>x.n===book);return b&&b.c[ch-1]?b.c[ch-1][v-1]||'':''}
function refKey(book,ch,v){return book+' '+ch+':'+v}
function toggleBookmark(book,ch,v,btn){const all=readStore('rb-bookmarks'),ref=refKey(book,ch,v);if(all[ref]){delete all[ref];if(btn)btn.textContent='🔖 Save';showToast('Bookmark removed')}else{all[ref]={book,ch,v,text:verseText(book,ch,v),savedAt:Date.now()};if(btn)btn.textContent='✓ Saved';showToast('Verse bookmarked')}writeStore('rb-bookmarks',all);updateDashboard()}
function toggleHighlight(btn){const d=btn.closest('details'),ref=refKey(d.dataset.book,+d.dataset.ch,+d.dataset.v),all=readStore('rb-highlights');if(all[ref]){delete all[ref];d.classList.remove('is-highlighted');btn.textContent='✨ Highlight';showToast('Highlight removed')}else{all[ref]=true;d.classList.add('is-highlighted');btn.textContent='✓ Highlighted';showToast('Verse highlighted')}writeStore('rb-highlights',all)}

function editNote(book, ch, v) {
  stopReadingAloud();

  const all = readStore('rb-notes');

  panel.innerHTML = '<h2>📝 Study note for ' + escapeHtml(ref) + '</h2>' +
    '<p class="muted">&ldquo;' + escapeHtml(verseText(book, ch, v)) + '&rdquo;</p>' +

    '<button class="action-btn" onclick="saveNote(' + JSON.stringify(book) + ',' + ch + ',' + v + ')">Save note</button>' +
    (existing ? '<button class="action-btn secondary" onclick="deleteNote(' + JSON.stringify(book) + ',' + ch + ',' + v + ')">Delete note</button>' : '') +
    '<button class="action-btn secondary" onclick="document.getElementById(\'utilityPanel\').classList.add(\'hidden\')">Close</button>' +
    '</div>';

function saveNote(book, ch, v) {
  const ref = refKey(book, ch, v);
  const text = (document.getElementById('noteText').value || '').trim();
  const all = readStore('rb-notes');
  if (text) {
    all[ref] = { book, ch, v, text: verseText(book, ch, v), note: text, updatedAt: Date.now() };
    writeStore('rb-notes', all);
    showToast('Note saved for ' + ref);
  } else {
    delete all[ref];
    writeStore('rb-notes', all);
    showToast('Note deleted');
  }
  showLibrary('notes');
}

function deleteNote(book, ch, v) {
  const ref = refKey(book, ch, v);
  const all = readStore('rb-notes');
  delete all[ref];
  writeStore('rb-notes', all);
  showToast('Note deleted');
  showLibrary('notes');
}

function readCurrentChapter(){if(!books.length)return;const bi=Number(document.getElementById('bookSel').value||0),ch=Number(document.getElementById('chapSel').value||1),book=books[bi];if(!book||!book.c[ch-1])return;const text=book.c[ch-1].map((v,i)=>(i+1)+'. '+v).join(' ');if(!('speechSynthesis' in window)||!('SpeechSynthesisUtterance' in window)){showToast('Read aloud is not supported in this browser.', true);return}stopReadingAloud();activeUtterance=new SpeechSynthesisUtterance(book.n+' chapter '+ch+'. '+text);activeUtterance.rate=0.88;activeUtterance.onend=()=>{activeUtterance=null};speechSynthesis.speak(activeUtterance);const panel=document.getElementById('utilityPanel');panel.classList.remove('hidden');panel.innerHTML='<h2>🔊 Reading aloud</h2><p>Now reading '+escapeHtml(book.n+' '+ch)+'.</p><button class="action-btn" onclick="stopReadingAloud()">■ Stop reading</button>';panel.scrollIntoView({behavior:'smooth',block:'start'})}
function stopReadingAloud(){if('speechSynthesis' in window)speechSynthesis.cancel();activeUtterance=null}

const BACKUP_KEYS=['rb-bookmarks','rb-highlights','rb-notes','rb-visited','rb-reading-days','rb-prayers','rb-study-worksheets','rb-font','rb-dark','rb-plan-0','rb-plan-1','rb-plan-2','twe-pos'];
function createBackup(){const data={app:'RonaldBible',formatVersion:1,exportedAt:new Date().toISOString(),data:{}};BACKUP_KEYS.forEach(k=>{try{const v=localStorage.getItem(k);if(v!==null)data.data[k]=v}catch(e){}});return JSON.stringify(data,null,2)}
function showBackup(){stopReadingAloud();const panel=document.getElementById('utilityPanel');panel.classList.remove('hidden');panel.innerHTML='<h2>💾 Backup & restore</h2><p class="muted">Back up bookmarks, notes, highlights, prayer journal, guided study notes, reading progress and preferences. Keep this backup private because it may contain personal notes.</p><button class="action-btn" onclick="generateBackup()">Generate backup</button><label class="muted" for="backupText" style="display:block;margin-top:12px">Backup JSON</label><textarea id="backupText" rows="8" placeholder="Tap Generate backup, or paste a previous backup here."></textarea><div class="tool-buttons"><button onclick="copyBackup()">Copy backup text</button><button class="secondary" onclick="restoreBackup()">Restore from pasted backup</button></div><p class="muted">To keep a copy, generate the backup, copy all the text, then save it in a private note or file. Restoring replaces only the listed RonaldBible saved-data keys.</p>';panel.scrollIntoView({behavior:'smooth',block:'start'})}
function generateBackup(){const t=document.getElementById('backupText');t.value=createBackup();t.focus();t.select();showToast('Backup generated')}
function copyBackup(){
  const t=document.getElementById('backupText');
  if(!t.value)t.value=createBackup();
  t.focus();
  t.select();
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(t.value).then(() => showToast('Backup copied to clipboard!')).catch(() => showToast('Backup text selected. Press Ctrl+C or Copy.'));
  } else {
    showToast('Backup text selected. Press Ctrl+C or Copy.');
  }
}
function restoreBackup(){
  const field=document.getElementById('backupText');
  let parsed;
  try{parsed=JSON.parse(field.value)}catch(e){showToast('That is not valid JSON. Paste a backup generated by RonaldBible.', true);return}
  if(!parsed||parsed.app!=='RonaldBible'||parsed.formatVersion!==1||!parsed.data||typeof parsed.data!=='object'){showToast('This backup is not a supported RonaldBible backup.', true);return}
  try{
    BACKUP_KEYS.forEach(k=>{if(Object.prototype.hasOwnProperty.call(parsed.data,k))localStorage.setItem(k,parsed.data[k])});
    showToast('Backup restored successfully!');
    setTimeout(() => location.reload(), 1200);
  }catch(e){showToast('Restore failed: device storage may be full.', true)}
}

const bibleDictionary = [
  ['Abraham','A patriarch whose story emphasizes trust in God and the covenant promise (Genesis 12–25).'],
  ['Covenant','A solemn relationship or promise established by God. Key examples include God’s promises to Abraham and the new covenant in Christ.'],
  ['Disciple','A learner or follower. In the Gospels, Jesus’ disciples learn from him and are sent to share his teaching.'],
  ['Faith','Trust and reliance on God. Hebrews 11 describes faith in relation to hope and confidence in what is not seen.'],
  ['Grace','God’s undeserved favour and kindness. The New Testament often connects grace with salvation and new life.'],
  ['Gospel','“Good news”; especially the good news of Jesus Christ, his kingdom, death and resurrection.'],
  ['Holy Spirit','The Spirit of God, who teaches, empowers, comforts and guides God’s people (John 14–16; Acts 1–2).'],
  ['Justification','Being declared righteous before God. Paul discusses justification by faith in Romans and Galatians.'],
  ['Kingdom of God','God’s reign and rule. Jesus teaches about the kingdom through preaching, actions and parables.'],
  ['Mercy','Compassion shown to someone in need or distress. Scripture repeatedly calls God’s people to practise mercy.'],
  ['Messiah','The Anointed One; a title Christians use for Jesus as the promised king and deliverer.'],
  ['Parable','A short story or comparison used to communicate a spiritual or moral truth, often found in Jesus’ teaching.'],
  ['Redemption','Deliverance or release, often at a cost. The New Testament uses this language for God’s saving work through Christ.'],
  ['Repentance','A turning from sin toward God, involving a change of mind and direction. See Acts 3:19.'],
  ['Righteousness','What is right in God’s sight; Scripture discusses God’s righteousness and the righteous life of believers.'],
  ['Salvation','God’s rescue from sin and its consequences, centred in the biblical story on Jesus Christ.'],
  ['Sanctification','Being set apart for God and growing in holiness. The New Testament connects it with the work of the Spirit.'],
  ['Wisdom','The ability to live rightly according to God’s truth. Proverbs and James contain extensive teaching on wisdom.'],
  ['Worship','Honouring God in reverence, praise, obedience and the offering of one’s life (Romans 12:1).'],
  ['Apostle','A person sent with a commission. The New Testament especially uses the title for Jesus’ appointed messengers.']
].sort((a,b)=>a[0].localeCompare(b[0]));

function renderReferenceButton(ref){return '<button class="action-btn secondary" onclick="goToVerse('+JSON.stringify(ref[0])+','+ref[1]+','+ref[2]+')">'+escapeHtml(ref[0]+' '+ref[1]+':'+ref[2])+'</button>'}
function showCrossReferences(){
  stopReadingAloud();const panel=document.getElementById('utilityPanel');panel.classList.remove('hidden');
  const options=Object.keys(crossReferenceData).sort();
  panel.innerHTML='<h2>🔗 Scripture cross-references</h2><p class="muted">Explore related passages. These curated links are a starting point; read each verse in its wider chapter context.</p><label for="xrefSearch">Find a reference</label><input id="xrefSearch" placeholder="e.g. John 3:16 or faith" oninput="filterCrossReferences()"><div id="xrefResults">'+crossReferenceCards(options)+'</div>';
  panel.scrollIntoView({behavior:'smooth',block:'start'});
}
function crossReferenceCards(keys){return keys.map(key=>{const m=key.match(/^(.*) (\d+):(\d+)$/),ref=[m[1],+m[2],+m[3]],text=verseText(...ref);return '<article class="saved-item"><strong>'+escapeHtml(key)+'</strong><p>'+escapeHtml(text||'Open this passage to read it.')+'</p><div class="tool-buttons">'+renderReferenceButton(ref)+crossReferenceData[key].map(renderReferenceButton).join('')+'</div></article>'}).join('')||'<div class="empty-state">No matching cross-references. Try a Bible reference such as John 3:16.</div>'}
function filterCrossReferences(){const q=(document.getElementById('xrefSearch').value||'').trim().toLowerCase();const keys=Object.keys(crossReferenceData).filter(k=>{const all=[k,...crossReferenceData[k].map(r=>r.join(' ')),...crossReferenceData[k].map(r=>r[0]+' '+r[1]+':'+r[2])].join(' ').toLowerCase();return all.includes(q)}).sort();document.getElementById('xrefResults').innerHTML=crossReferenceCards(keys)}
function showBibleDictionary(){
  stopReadingAloud();const panel=document.getElementById('utilityPanel');panel.classList.remove('hidden');
  panel.innerHTML='<h2>📚 Bible dictionary</h2><p class="muted">Short study definitions to help you read in context. These are introductory summaries, not a substitute for a full Bible dictionary.</p><input id="dictSearch" placeholder="Search a word or topic…" oninput="filterBibleDictionary()"><div id="dictResults">'+dictionaryCards(bibleDictionary)+'</div>';
  panel.scrollIntoView({behavior:'smooth',block:'start'});
}
function dictionaryCards(items){return items.map(([term,definition])=>'<article class="saved-item"><strong>'+escapeHtml(term)+'</strong><p>'+escapeHtml(definition)+'</p></article>').join('')||'<div class="empty-state">No dictionary entry found. Try another word.</div>'}
function filterBibleDictionary(){const q=(document.getElementById('dictSearch').value||'').trim().toLowerCase();document.getElementById('dictResults').innerHTML=dictionaryCards(bibleDictionary.filter(([t,d])=>(t+' '+d).toLowerCase().includes(q)))}
function showStudyGuide(){
  stopReadingAloud();const panel=document.getElementById('utilityPanel');panel.classList.remove('hidden');
  const bi=Number(document.getElementById('bookSel').value||0),ch=Number(document.getElementById('chapSel').value||1),book=books[bi];
  panel.innerHTML='<h2>🧠 Guided Bible study</h2><p class="muted">Use this offline worksheet to study a passage carefully. It helps you observe the text, interpret it in context and apply it thoughtfully.</p><label for="studyReference">Passage</label><input id="studyReference" value="'+escapeHtml(book?book.n+' '+ch:'John 3')+'"><label for="studyObservation">1. Observation — What does the passage say?</label><textarea id="studyObservation" rows="3" placeholder="Repeated words, people, events, commands…"></textarea><label for="studyMeaning">2. Interpretation — What did it mean in context?</label><textarea id="studyMeaning" rows="3" placeholder="Read the surrounding verses and note the main idea…"></textarea><label for="studyApplication">3. Application — What response is appropriate today?</label><textarea id="studyApplication" rows="3" placeholder="A practical response, not just a general idea…"></textarea><label for="studyPrayer">4. Prayer</label><textarea id="studyPrayer" rows="3" placeholder="Respond to God in prayer…"></textarea><button class="action-btn" onclick="saveStudyWorksheet()">Save study notes</button><button class="action-btn secondary" onclick="showSavedStudies()">View saved studies</button><p class="muted">Saved on this device. Export a backup regularly to avoid losing your work.</p>';
  panel.scrollIntoView({behavior:'smooth',block:'start'});
}
function saveStudyWorksheet(){const reference=(document.getElementById('studyReference').value||'').trim();if(!reference){showToast('Enter the Bible passage first.', true);return}const all=readStore('rb-study-worksheets'),id='study-'+Date.now();all[id]={reference,observation:document.getElementById('studyObservation').value.trim(),meaning:document.getElementById('studyMeaning').value.trim(),application:document.getElementById('studyApplication').value.trim(),prayer:document.getElementById('studyPrayer').value.trim(),updatedAt:Date.now()};writeStore('rb-study-worksheets',all);showToast('Study notes saved on this device.');showSavedStudies()}
function showSavedStudies(){const panel=document.getElementById('utilityPanel'),all=readStore('rb-study-worksheets');panel.classList.remove('hidden');const entries=Object.entries(all).sort((a,b)=>(b[1].updatedAt||0)-(a[1].updatedAt||0));panel.innerHTML='<h2>🧠 My saved Bible studies</h2>'+(entries.length?entries.map(([id,x])=>'<article class="saved-item"><strong>'+escapeHtml(x.reference)+'</strong><p><b>Observation:</b> '+escapeHtml(x.observation||'—')+'</p><p><b>Interpretation:</b> '+escapeHtml(x.meaning||'—')+'</p><p><b>Application:</b> '+escapeHtml(x.application||'—')+'</p><p><b>Prayer:</b> '+escapeHtml(x.prayer||'—')+'</p><button class="action-btn secondary" onclick="deleteStudyWorksheet('+JSON.stringify(id)+')">Delete</button></article>').join(''):'<div class="empty-state">No saved studies yet. Start a guided study to record your observations.</div>')+'<button class="action-btn secondary" onclick="showStudyGuide()">＋ New study</button>';panel.scrollIntoView({behavior:'smooth',block:'start'})}
function deleteStudyWorksheet(id){
  const all=readStore('rb-study-worksheets');
  delete all[id];
  writeStore('rb-study-worksheets',all);
  showToast('Study notes deleted');
  showSavedStudies();
}

function initPersonalTools(){try{if(localStorage.getItem('rb-dark')==='1'){document.body.classList.add('dark');document.getElementById('themeBtn').textContent='☀️ Light mode'}const fs=localStorage.getItem('rb-font')||'18';document.getElementById('fontSize').value=fs;setFontSize(fs)}catch(e){}const refs=[];books.forEach(b=>b.c.forEach((vs,ci)=>vs.forEach((text,vi)=>refs.push({book:b.n,ch:ci+1,v:vi+1,text}))));if(refs.length){const day=Math.floor(Date.now()/86400000),x=refs[(day*7919)%refs.length];document.getElementById('dailyText').textContent='“'+x.text+'”';document.getElementById('dailyRef').textContent=x.book+' '+x.ch+':'+x.v}document.getElementById('searchInput').addEventListener('keydown',e=>{if(e.key==='Enter')searchBible()});updateDashboard()}

init().catch(err => {
